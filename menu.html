<html>
    <head>
        <style>
            *{
                margin:0px;
                padding: 0px;
            }
            ul
            {
                list-style-type: none;
            }
            ul li
            {
                height: 50px;
                width: 200px;
                background: yellow;
                float: left;
                text-align: center;
            }
            ul li a{
                text-decoration: none;
                line-height: 50px;
                font-size: 22px;
                font-weight: bold;
            }
            ul li a:hover{
                background:red;
                color: white;
                display: block;
            }
            ul ul
            {
                display: none;
            }
            ul li:hover>ul
            {
                display: block;
            }
            ul ul ul
            {
                margin-left: 200px;
                margin-top: -50px;
            }
            
        </style>
    </head>
    <body>
        <ul>
            <li> <a href="">Home</a></li>
            <li> <a href="">About</a></li>
            <li> <a href="">Gallery</a>
                <ul>
                    <li><a href="">Image</a></li>
                    <li><a href="">Video</a>
                        <ul>
                            <li><a href="">4K</a></li>
                            <li><a href="">HD</a></li>
                        </ul>
                    </li>
                </ul>
            </li>
            <li> <a href="">Contact</a></li>
            <li> <a href="">Regsiter</a></li>
        </ul>
     </body>
</html>
