<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* =========================
           MAIN NAVBAR
        ========================= */

        .navbar {
            width: 100%;
            background: yellow;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        /* Menu */
        .menu {
            list-style: none;
            display: flex;
            flex: 1;
        }

        .menu > li {
            position: relative;
        }

        .menu > li > a {
            display: block;
            padding: 0 25px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            color: black;
        }

        .menu > li > a:hover {
            background: red;
            color: white;
        }


        /* =========================
           DROPDOWN
        ========================= */

        .menu ul {
            display: none;
            list-style: none;
            position: absolute;
            top: 50px;
            left: 0;
            width: 200px;
            background: yellow;
            z-index: 1000;
        }

        .menu li:hover > ul {
            display: block;
        }

        .menu ul li {
            position: relative;
            width: 100%;
        }

        .menu ul li a {
            display: block;
            width: 100%;
            height: 50px;
            line-height: 50px;
            padding: 0 20px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: black;
        }

        .menu ul li a:hover {
            background: red;
            color: white;
        }


        /* =========================
           THIRD LEVEL DROPDOWN
        ========================= */

        .menu ul ul {
            top: 0;
            left: 200px;
        }


        /* =========================
           RIGHT SIDE BUTTONS
        ========================= */

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-buttons a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .login-btn {
            background: white;
            color: black;
            border: 2px solid black;
        }

        .signup-btn {
            background: red;
            color: white;
            border: 2px solid red;
        }

        .login-btn:hover {
            background: black;
            color: white;
        }

        .signup-btn:hover {
            background: darkred;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .navbar {
                flex-direction: column;
                padding: 0;
            }

            .menu {
                flex-direction: column;
                width: 100%;
            }

            .menu > li {
                width: 100%;
            }

            .menu > li > a {
                text-align: left;
                padding-left: 20px;
            }

            /* Dropdown */

            .menu ul {
                position: static;
                width: 100%;
            }

            .menu ul li a {
                padding-left: 40px;
            }

            /* Third level */

            .menu ul ul {
                position: static;
                width: 100%;
            }

            .menu ul ul li a {
                padding-left: 60px;
            }


            /* Buttons */

            .nav-buttons {
                width: 100%;
                padding: 10px 20px;
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <!-- LEFT MENU -->
        <ul class="menu">

            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">Gallery</a>

                <ul>

                    <li>
                        <a href="#">Image</a>
                    </li>

                    <li>
                        <a href="#">Video</a>

                        <ul>

                            <li>
                                <a href="#">4K</a>
                            </li>

                            <li>
                                <a href="#">HD</a>
                            </li>

                        </ul>

                    </li>

                </ul>

            </li>

            <li>
                <a href="#">Contact</a>
            </li>

            <li>
                <a href="#">Register</a>
            </li>

        </ul>


        <!-- RIGHT SIDE BUTTONS -->
        <div class="nav-buttons">

            <a href="#" class="login-btn">
                Login
            </a>

            <a href="#" class="signup-btn">
                Sign Up
            </a>

        </div>

    </nav>

</body>
</html>
