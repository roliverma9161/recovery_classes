<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="board">

    <!-- Red -->
    <div class="home red">
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
    </div>

    <!-- Top Path -->
    <div class="path horizontal"></div>

    <!-- Green -->
    <div class="home green">
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
    </div>

    <!-- Left Path -->
    <div class="path vertical"></div>

    <!-- Center -->
    <div class="center">
        <div class="triangle red"></div>
        <div class="triangle green"></div>
        <div class="triangle blue"></div>
        <div class="triangle yellow"></div>
    </div>

    <!-- Right Path -->
    <div class="path vertical"></div>

    <!-- Blue -->
    <div class="home blue">
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
    </div>

    <!-- Bottom Path -->
    <div class="path horizontal"></div>

    <!-- Yellow -->
    <div class="home yellow">
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
        <div class="token"></div>
    </div>

</div>

</body>
</html>
